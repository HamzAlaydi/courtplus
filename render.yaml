# ⚠️ NOT THE PRODUCTION DEPLOYMENT. DO NOT APPLY THIS BLUEPRINT. ⚠️
#
# Court+ does not run on Render. Production is a single AWS EC2 instance running
# backend/docker-compose.prod.yml (api + postgis + redis + caddy), with the three
# frontends on Vercel. See OPERATIONS.md §5 for the real deploy procedure.
#
# This file is kept only as a reference for the environment-variable set. It is
# deliberately left non-applyable because applying it would be actively harmful:
#
#   - It would stand up a SECOND live environment pointed at the same Stripe,
#     Twilio, AWS and Firebase credentials as production — duplicate webhook
#     consumers, duplicate charges, duplicate SMS.
#   - `plan: free` Postgres has no backups and is deleted after 90 days of
#     inactivity. Court+ already has no database backups; this would add a
#     second copy of that problem.
#   - healthCheckPath pointed at /reference/api — the Swagger docs page — so
#     Render would report the service healthy while the database was down.
#     A real probe now exists at /health/ready.
#   - It never sets STRIPE_CONNECT_WEBHOOK_SECRET, MAIL_DRIVER, SMTP_USER,
#     SMTP_PASS, STRIPE_BRANCH_ADDON_PRICE_ID or STRIPE_COURT_ADDON_PRICE_ID,
#     all of which are read at runtime.
#
# If Render ever becomes the real target, rewrite this from scratch against the
# current validation schema in backend/src/config/validation.ts rather than
# trusting the list below.

# Intentionally left with no `services:` or `databases:` key so that a
# `render blueprint launch` against this file is a no-op rather than a surprise
# second production environment.
